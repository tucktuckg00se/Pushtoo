[project]
name = "pushtoo"
version = "0.1.0.dev0"
description = "Turn an Ableton Push 2 on Linux into a DAW-agnostic MIDI controller"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "push2-python @ git+https://github.com/tucktuckg00se/push2-python@d7403080f7a37dc9b4b30a029800615a84a93547",
    "python-rtmidi>=1.5",
    "mido>=1.3",
    "pycairo>=1.26",
    "numpy>=2.0",
]

[project.scripts]
pushtoo = "pushtoo.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pushtoo"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
