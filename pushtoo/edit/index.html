<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pushtoo profiles</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0b0c0d; --panel: #16181b; --raised: #1f2226; --line: #2b2f34;
    --text: #ced4da; --dim: #868e96; --accent: #82c91e; --knobs: #fcc419;
    --edited: #4dabf7; --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  #status { flex: 1; min-width: 200px; color: var(--dim); }
  #status.error { color: var(--error); }
  #status.dirty { color: var(--edited); }
  main { max-width: 1240px; margin: 0 auto; padding: 8px 20px 60px; }
  nav { display: flex; gap: 4px; margin: 16px 0; flex-wrap: wrap; }
  nav button.on { background: var(--accent); color: #000; border-color: var(--accent); }
  section h2 { font-size: 15px; color: var(--dim); font-weight: 500; margin: 20px 0 8px; }
  button, select, input {
    font: inherit; color: var(--text); background: var(--raised);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { opacity: .4; cursor: default; }
  button.small { padding: 1px 7px; font-size: 13px; }
  input[type=number] { width: 72px; }
  input[type=text] { width: 100%; min-width: 120px; }
  input:invalid { border-color: var(--error); }
  .hint { color: var(--dim); font-size: 13px; }
  .field { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: start; padding: 5px 0; }
  .field > label { color: var(--dim); padding-top: 6px; }
  .field.edited > label { color: var(--edited); }
  .field.edited > label::after { content: " •"; }
  .group { border-left: 2px solid var(--line); padding-left: 14px; margin: 4px 0 8px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .list > .item { display: flex; gap: 6px; align-items: start; margin: 4px 0; }
  .reset { visibility: hidden; }
  .edited > .row > .reset, .edited > div > .reset { visibility: visible; }
  /* Knobs: eight columns, like the encoders */
  .pages { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .pages button.on { background: var(--knobs); color: #000; border-color: var(--knobs); }
  .knobs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 1000px) { .knobs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .knobs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .field { grid-template-columns: 1fr; } }
  .knob { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 230px; }
  .knob.edited { border-color: var(--edited); }
  .knob .bar { height: 4px; border-radius: 2px; }
  .knob label { font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .knob input[type=number] { width: 58px; padding: 3px 5px; }
  .knob .col { font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; }
  .knob.empty { align-items: center; justify-content: center; color: var(--dim); border-style: dashed; }
  .swatches { display: flex; flex-wrap: wrap; gap: 3px; }
  .swatch { width: 16px; height: 16px; border-radius: 3px; border: 2px solid transparent; padding: 0; }
  .swatch.on { border-color: #fff; }
  .error-box { border: 1px solid var(--error); color: var(--error); border-radius: 6px; padding: 10px 14px; margin-top: 16px; display: none; }
</style>
</head>
<body>
<header>
  <h1><span>Pushtoo</span> profiles</h1>
  <select id="file" aria-label="Profile"></select>
  <div id="status">Loading…</div>
  <button id="revert" title="Delete the edits file: back to the profile as written">Back to the file</button>
  <button id="save" class="primary" disabled>Save</button>
</header>
<main>
  <p class="hint" id="about"></p>
  <div class="error-box" id="load-error"></div>
  <nav id="tabs"></nav>
  <div id="form"></div>
</main>
<script>
"use strict";
const SECTIONS = [
  ["knobs", "Knobs"], ["play", "Play"], ["rhythm", "Rhythm"],
  ["mix", "Mix"], ["undo", "Undo"], ["general", "General"],
];
const GENERAL = ["name", "output", "theme"];
const S = { file: null, schema: null, base: null, profile: null, saved: null, colors: {},
            tab: "knobs", page: 0, timer: null, valid: true };
const $ = (sel) => document.querySelector(sel);
const clone = (v) => JSON.parse(JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k === "class") node.className = v;
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null) node.append(c);
  return node;
}
const get = (obj, path) => path.reduce((o, k) => (o == null ? undefined : o[k]), obj);
function set(obj, path, value) {
  const last = path[path.length - 1];
  get(obj, path.slice(0, -1))[last] = value;
}
function resolve(schema) {
  while (schema && schema.$ref) schema = S.schema.$defs[schema.$ref.split("/").pop()];
  return schema || {};
}
function nullable(schema) {
  const options = schema.anyOf || [];
  const other = options.find((o) => o.type !== "null");
  return options.length === 2 && options.some((o) => o.type === "null") ? other : null;
}
function title(key, schema) {
  if (typeof key === "number") return `${key + 1}`;
  const t = (schema && schema.title) || key;
  return t.replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase());
}
function blank(schema) {
  schema = resolve(schema);
  if (schema.default !== undefined) return clone(schema.default);
  if (nullable(schema)) return null;
  if (schema.enum) return schema.enum[0];
  if (schema.type === "object") {
    const o = {};
    for (const [k, p] of Object.entries(schema.properties || {})) o[k] = blank(p);
    return o;
  }
  if (schema.type === "array") return [];
  if (schema.type === "integer" || schema.type === "number") return schema.minimum ?? 0;
  if (schema.type === "boolean") return false;
  return "";
}

// Changes: mark edited fields, check them with Pushtoo, and keep Save honest.
function changed() {
  for (const node of document.querySelectorAll("[data-path]")) {
    const path = JSON.parse(node.dataset.path);
    node.classList.toggle("edited", !same(get(S.profile, path), get(S.base, path)));
  }
  const dirty = !same(S.profile, S.saved);
  $("#save").disabled = !dirty;
  status(dirty ? "Checking…" : "Saved", dirty ? "dirty" : "");
  clearTimeout(S.timer);
  if (dirty) S.timer = setTimeout(validate, 250);
}
function status(text, kind = "") { const s = $("#status"); s.textContent = text; s.className = kind; }
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body) });
  return r.json();
}
async function validate() {
  const result = await post("/api/validate", { file: S.file, profile: S.profile });
  S.valid = result.ok;
  $("#save").disabled = !result.ok || same(S.profile, S.saved);
  if (!result.ok) status(result.error, "error");
  else status(same(S.profile, S.saved) ? "Saved" : "Not saved yet · Ctrl+S saves", "dirty");
}
async function save() {
  if ($("#save").disabled) return;
  const result = await post("/api/save", { file: S.file, profile: S.profile });
  if (!result.ok) return status(result.error, "error");
  S.saved = clone(S.profile);
  $("#save").disabled = true;
  status(result.saved ? `Saved to ${result.saved} · the Push follows in a second` :
                        "No edits left: Pushtoo uses the file as written");
  loadList();
}

// Generic fields, from the profile's schema
function field(key, schema, path, render) {
  // A property's own title, else its key: a shared type's name ("PlayLayout") says less.
  const label = el("label", {}, title(key, schema.$ref ? null : schema));
  const described = resolve(schema).description;
  if (described) label.title = described;
  return el("div", { class: "field", "data-path": JSON.stringify(path) }, label,
            el("div", {}, input(schema, path, render)));
}
function input(schema, path, render) {
  schema = resolve(schema);
  const value = get(S.profile, path);
  const inner = nullable(schema);
  if (inner) {
    const on = value !== null && value !== undefined;
    const toggle = el("input", { type: "checkbox", checked: on, onchange: () => {
      set(S.profile, path, toggle.checked ? blank(inner) : null); render(); changed(); } });
    return el("div", { class: "row" }, toggle, on ? input(inner, path, render)
              : el("span", { class: "hint" }, "not set"));
  }
  if (schema.enum || schema.const !== undefined) {
    const options = schema.enum || [schema.const];
    const select = el("select", { onchange: () => { set(S.profile, path, select.value); changed(); } },
      options.map((o) => el("option", { value: o, selected: o === value }, o)));
    return select;
  }
  if (schema.type === "boolean") {
    const box = el("input", { type: "checkbox", checked: !!value,
                              onchange: () => { set(S.profile, path, box.checked); changed(); } });
    return box;
  }
  if (schema.type === "integer" || schema.type === "number") {
    const box = el("input", { type: "number", value, min: schema.minimum, max: schema.maximum,
                              step: schema.type === "integer" ? 1 : "any",
                              oninput: () => { if (box.value !== "") { set(S.profile, path, Number(box.value)); changed(); } } });
    return box;
  }
  if (schema.type === "array") return list(schema, path, render);
  if (schema.type === "object" && schema.properties) {
    return el("div", { class: "group" }, Object.entries(schema.properties).map(
      ([k, p]) => field(k, p, [...path, k], render)));
  }
  if (schema.type === "object" && schema.additionalProperties) return dict(schema, path, render);
  const box = el("input", { type: "text", value: value ?? "", minlength: schema.minLength,
                            maxlength: schema.maxLength,
                            oninput: () => { set(S.profile, path, box.value); changed(); } });
  return box;
}
function list(schema, path, render) {
  const items = get(S.profile, path) || [];
  const fixed = schema.minItems !== undefined && schema.minItems === schema.maxItems;
  const rows = items.map((_, i) => el("div", { class: "item" },
    el("span", { class: "hint" }, `${i + 1}`), input(schema.items, [...path, i], render),
    fixed ? null : el("button", { class: "small", title: "Remove", onclick: () => {
      items.splice(i, 1); render(); changed(); } }, "×")));
  const full = schema.maxItems !== undefined && items.length >= schema.maxItems;
  const add = fixed || full ? null : el("button", { class: "small", onclick: () => {
    if (!get(S.profile, path)) set(S.profile, path, []);
    get(S.profile, path).push(blank(schema.items)); render(); changed(); } }, "+ Add");
  return el("div", { class: "list" }, rows, add);
}
function dict(schema, path, render) {
  const value = get(S.profile, path) || {};
  const rows = Object.keys(value).map((name) => {
    const rename = el("input", { type: "text", value: name, onchange: () => {
      const entries = Object.entries(value).map(([k, v]) => [k === name ? rename.value : k, v]);
      set(S.profile, path, Object.fromEntries(entries)); render(); changed(); } });
    return el("div", { class: "group" },
      el("div", { class: "row" }, rename, el("button", { class: "small", onclick: () => {
        delete value[name]; render(); changed(); } }, "Remove")),
      input(schema.additionalProperties, [...path, name], render));
  });
  const add = el("button", { class: "small", onclick: () => {
    let name = "New set", n = 2;
    while (name in value) name = `New set ${n++}`;
    value[name] = blank(schema.additionalProperties);
    set(S.profile, path, value); render(); changed(); } }, "+ Add");
  return el("div", {}, rows, add);
}

// Knobs: pages of eight controls, laid out like the encoders over the display
function knobs(render) {
  const pages = S.profile.knobs.pages;
  S.page = Math.min(S.page, pages.length - 1);
  const pageTabs = pages.map((p, i) => el("button", { class: i === S.page ? "on" : "",
    onclick: () => { S.page = i; render(); } }, p.name || `Page ${i + 1}`));
  const page = pages[S.page];
  const path = ["knobs", "pages", S.page];
  const tools = el("div", { class: "pages" }, pageTabs,
    pages.length < 8 ? el("button", { class: "small", onclick: () => {
      pages.push({ name: `Page ${pages.length + 1}`, controls: Array(8).fill(null) });
      S.page = pages.length - 1; render(); changed(); } }, "+ Page") : null);
  const name = el("input", { type: "text", value: page.name, maxlength: 24, style: "max-width:260px",
    oninput: () => { page.name = name.value; pageTabs[S.page].textContent = name.value || "…"; changed(); } });
  const pageTools = el("div", { class: "row", style: "margin-bottom:12px" },
    el("span", { class: "hint" }, "Page name"), name,
    S.page > 0 ? el("button", { class: "small", onclick: () => { move(pages, S.page, -1); S.page--; render(); changed(); } }, "Move left") : null,
    S.page < pages.length - 1 ? el("button", { class: "small", onclick: () => { move(pages, S.page, 1); S.page++; render(); changed(); } }, "Move right") : null,
    pages.length > 1 ? el("button", { class: "small", onclick: () => {
      if (confirm(`Remove the page “${page.name}”?`)) { pages.splice(S.page, 1); render(); changed(); } } }, "Remove page") : null);
  const columns = [...Array(8).keys()];  // short pages show their empty columns too
  const grid = el("div", { class: "knobs" }, columns.map((i) => knob(page.controls[i] ?? null, [...path, "controls", i], i, render)));
  return el("section", {}, el("h2", {}, "Knobs mode: each column is an encoder, its color the button above it"),
            tools, pageTools, grid);
}
function move(list, i, by) { const [x] = list.splice(i, 1); list.splice(i + by, 0, x); }
function knob(control, path, column, render) {
  const props = { "data-path": JSON.stringify(path) };
  if (!control) {
    return el("div", { class: "knob empty", ...props },
      el("div", { class: "col" }, `Encoder ${column + 1}`),
      el("button", { onclick: () => {
        const page = get(S.profile, path.slice(0, -2));
        while (page.controls.length <= column) page.controls.push(null);
        const used = page.controls.filter(Boolean);
        const channel = used.length ? used[used.length - 1].channel : 1;
        set(S.profile, path, { name: `Knob ${column + 1}`, cc: 14 + column, channel, min: 0, max: 127,
                               default: null, color: "amber", bipolar: false });
        render(); changed(); } }, "+ Control"));
  }
  const number = (key, label, min, max) => {
    const box = el("input", { type: "number", min, max, value: control[key] ?? "",
      placeholder: key === "default" ? "—" : null,
      oninput: () => { control[key] = box.value === "" ? (key === "default" ? null : control[key]) : Number(box.value); changed(); } });
    return el("label", {}, label, box);
  };
  const bar = el("div", { class: "bar", style: `background:${S.colors[control.color] || "#fab005"}` });
  const swatches = el("div", { class: "swatches" }, Object.entries(S.colors).map(([name, hex]) =>
    el("button", { class: "swatch" + (name === control.color ? " on" : ""), title: name,
                   style: `background:${hex}`, onclick: () => { control.color = name; render(); changed(); } })));
  const name = el("input", { type: "text", value: control.name, maxlength: 32,
                             oninput: () => { control.name = name.value; changed(); } });
  const bipolar = el("input", { type: "checkbox", checked: control.bipolar,
                                onchange: () => { control.bipolar = bipolar.checked; changed(); } });
  return el("div", { class: "knob", ...props }, bar,
    el("div", { class: "col" }, `Encoder ${column + 1}`,
       el("button", { class: "small", title: "Empty this column", onclick: () => {
         set(S.profile, path, null); render(); changed(); } }, "×")),
    name, number("cc", "CC", 0, 127), number("channel", "Channel", 1, 16),
    number("min", "Min", 0, 127), number("max", "Max", 0, 127), number("default", "Default", 0, 127),
    el("label", {}, "Bipolar", bipolar), swatches);
}

function render() {
  const form = $("#form");
  form.replaceChildren();
  $("#tabs").replaceChildren(...SECTIONS.map(([key, label]) => el("button", {
    class: key === S.tab ? "on" : "", onclick: () => { S.tab = key; render(); } }, label)));
  if (!S.profile) return;
  const props = S.schema.properties;
  if (S.tab === "knobs") form.append(knobs(render));
  else if (S.tab === "general") form.append(el("section", {}, GENERAL.map((k) => field(k, props[k], [k], render))));
  else form.append(el("section", {}, input(props[S.tab], [S.tab], render)));
  changed();
}

async function loadList() {
  const files = await (await fetch("/api/profiles")).json();
  const select = $("#file");
  select.replaceChildren(...files.map((f) => el("option", { value: f.file, selected: f.file === S.file },
    `${f.name} (${f.file})${f.edited ? " · edited" : ""}`)));
  return files;
}
async function open(file) {
  if (S.profile && !same(S.profile, S.saved) && !confirm("Leave without saving your changes?")) {
    $("#file").value = S.file; return;
  }
  const data = await (await fetch(`/api/profile?file=${encodeURIComponent(file)}`)).json();
  Object.assign(S, { file, schema: data.schema, base: data.base, profile: data.profile,
                     saved: clone(data.profile), colors: data.colors, page: 0 });
  history.replaceState(null, "", `#${file}`);
  $("#file").value = file;
  $("#about").textContent = `Changes are saved to ${data.edits_file}, next to ${file}, which stays as you wrote it. ` +
                            "A running Pushtoo picks them up within a second. Edited values are marked in blue.";
  const box = $("#load-error");
  box.style.display = data.error ? "block" : "none";
  box.textContent = data.error ? `Pushtoo can't load this profile as it is: ${data.error}` : "";
  render();
}

$("#file").addEventListener("change", (e) => open(e.target.value));
$("#save").addEventListener("click", save);
$("#revert").addEventListener("click", async () => {
  if (!S.base || !confirm("Drop every edit made here and use the file as written?")) return;
  S.profile = clone(S.base); render(); await save();
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
});
window.addEventListener("beforeunload", (e) => {
  if (S.profile && !same(S.profile, S.saved)) e.preventDefault();
});
(async () => {
  const files = await loadList();
  const wanted = decodeURIComponent(location.hash.slice(1));
  open(files.some((f) => f.file === wanted) ? wanted : (files[0] || {}).file);
})();
</script>
</body>
</html>
