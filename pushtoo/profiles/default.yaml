# Pushtoo profile. Edit this file while Pushtoo runs: changes apply when you save.
# If something is wrong, Pushtoo shows the error on the Push screen and keeps the
# last working version. Every section is optional; anything you leave out uses the
# defaults shown in the comments. MIDI channels are 1-16.

name: Default

# Where Knobs, Mix and MIDI undo messages go: "Pushtoo Out" or a hardware port
# name as shown on Play mode's Output page.
output: Pushtoo Out

play:
  keyboard: {channel: 1, output: Pushtoo Out}
  drums: {channel: 10, output: Pushtoo Out}
  chord: {channel: 2, bass_channel: 3, output: Pushtoo Out}
  velocity_curve: Linear   # Linear, Soft or Hard
  strip: Pitch bend        # Pitch bend or Mod wheel

# Undo and Shift+Undo. Each is either a keystroke sent to the focused window, or
# a MIDI CC for DAWs that map actions to MIDI. Keystrokes use physical key
# positions, so on a non-QWERTY layout "z" means the key where Z is on QWERTY.
undo:
  undo: {keys: ctrl+z}
  redo: {keys: ctrl+shift+z}
  # redo: {keys: ctrl+y}
  # undo: {midi: {cc: 118, channel: 16}}

mix:
  channel: 14
  names: [Track 1, Track 2, Track 3, Track 4, Track 5, Track 6, Track 7, Track 8]
  faders: [102, 103, 104, 105, 106, 107, 108, 109]
  master: 110
  mute: [14, 15, 16, 17, 18, 19, 20, 21]
  solo: [22, 23, 24, 25, 26, 27, 28, 29]

# Knobs: up to 8 pages of up to 8 controls. Leave this section out to get the
# default map: 8 pages of "Knob 1".."Knob 64", pages 1-4 on channel 15 and 5-8 on
# channel 16, using CCs 14-29 and 102-117. If you write a knobs section, it
# replaces the default map entirely. Use null for an empty column.
#
# knobs:
#   pages:
#     - name: Synth
#       controls:
#         - {name: Cutoff, cc: 74, channel: 1, color: orange}
#         - {name: Resonance, cc: 71, channel: 1, color: orange}
#         - {name: Attack, cc: 73, channel: 1, color: green}
#         - {name: Release, cc: 72, channel: 1, color: green}
#         - null
#         - {name: Detune, cc: 94, channel: 1, color: violet, bipolar: true}
#         - {name: Reverb, cc: 91, channel: 1, color: blue, default: 20}
#         - {name: Volume, cc: 7, channel: 1, color: white, min: 0, max: 110, default: 100}
#
# Colors: red, orange, amber, yellow, green, teal, blue, violet, pink, white.
