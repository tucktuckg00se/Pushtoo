name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcairo2-dev pkg-config
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Lint the installer
        run: uvx --from shellcheck-py shellcheck -s sh install.sh

  install:
    # The one-command installer on a clean Debian, as root (no sudo), without the
    # parts that need a desktop session (udev, the user service).
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y curl git ca-certificates
      - uses: actions/checkout@v4
      - run: ./install.sh --yes --no-udev --no-service --from .
      - run: '"$HOME/.local/bin/pushtoo" --version'
      - name: pushtoo doctor (no MIDI or Push in CI, so it reports rather than passes)
        run: '"$HOME/.local/bin/pushtoo" doctor || true'
